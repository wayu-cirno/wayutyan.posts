name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content
        uses: actions/checkout@v6
        with:
          path: content

      - name: Checkout Astro template
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/astro.com
          path: template

      - name: Copy content
        run: |
          rm -rf template/src/content/pages
          mkdir -p template/src/content/pages

          find content -mindepth 1 -maxdepth 1 -type d \
            -exec cp -r {} template/src/content/pages/ \;

          if [ -f content/index.mdx ]; then
            cp content/index.mdx template/src/content/pages/index.mdx
          fi

      - name: Build Astro
        uses: withastro/action@v6
        with:
          path: template

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5